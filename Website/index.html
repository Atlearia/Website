<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <meta name="description" content="Atlearia — an immersive 3D room experience">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&family=MedievalSharp&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #06060b;
      --bg-surface: #0c0c14;
      --accent-primary: #a08cff;
      --accent-warm: #e8c47c;
      --accent-glow: rgba(160, 140, 255, 0.12);
      --text-primary: #e8e4f0;
      --text-muted: rgba(200, 195, 230, 0.4);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Canvas ── */
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Loading Screen ── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000000;
      transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1),
        visibility 1.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* tree animation container */
    .loader-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: -10vh;
    }

    /* the tree growth video — centered, no glow/shadow.
       played in sync with model download progress (see initTreeLoader). */
    #loader-tree-video {
      width: clamp(630px, 100vw, 1170px);
      height: auto;
      object-fit: contain;
      opacity: 0;
      pointer-events: none;
      animation: tree-fade-in 1.2s ease forwards 0.1s;
    }

    @keyframes tree-fade-in {
      from {
        opacity: 0;
        transform: scale(0.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* percentage counter — MedievalSharp fantasy font */
    .loader-percent {
      margin-top: -6%;
      z-index: 2;
      font-family: 'MedievalSharp', 'Cormorant Garamond', cursive;
      font-size: clamp(16px, 2.5vw, 24px);
      font-variant-numeric: tabular-nums;
      letter-spacing: 6px;
      color: rgba(232, 196, 124, 0.85);
      text-shadow: 0 0 18px rgba(232, 196, 124, 0.25);
      opacity: 0;
      animation: percent-fade-in 0.8s ease forwards 0.5s;
    }

    @keyframes percent-fade-in {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* thin golden progress bar */
    .loader-progress-bar {
      margin-top: 12px;
      width: clamp(140px, 20vw, 220px);
      height: 1px;
      background: rgba(232, 196, 124, 0.08);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
      opacity: 0;
      animation: percent-fade-in 0.8s ease forwards 0.7s;
    }

    .loader-progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, rgba(232, 196, 124, 0.4), rgba(255, 180, 80, 0.8));
      border-radius: 1px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* hints UI */
    .ui-fade {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
    }

    .ui-fade.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #controls-hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 24px;
      transition-delay: 0.6s;
    }

    .hint-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: rgba(200, 195, 230, 0.25);
    }

    .hint-key {
      padding: 3px 8px;
      border: 1px solid rgba(160, 140, 255, 0.1);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 400;
      color: rgba(160, 140, 255, 0.4);
      background: rgba(160, 140, 255, 0.03);
    }

    /* debug stuff */
    /* devmode tools, hidden unless u enter konami code */
    #debug-coords,
    #record-btn,
    #log-btn,
    #quality-panel,
    #controls-hint {
      display: none;
    }

    body.dev-mode #debug-coords,
    body.dev-mode #record-btn,
    body.dev-mode #log-btn,
    body.dev-mode #quality-panel {
      display: block;
    }

    /* quality tier panel in devmode */
    #quality-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 50;
      width: 240px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(160, 140, 255, 0.2);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      color: #c0c0d0;
    }

    .qp-title {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(160, 140, 255, 0.5);
      margin-bottom: 10px;
    }

    .qp-info {
      font-size: 10px;
      line-height: 1.6;
      color: rgba(160, 200, 160, 0.6);
      margin-bottom: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .qp-tiers {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .qp-tier-btn {
      flex: 1;
      padding: 7px 4px;
      font-family: 'Courier New', monospace;
      font-size: 9px;
      letter-spacing: 0.5px;
      text-align: center;
      border: 1px solid rgba(100, 100, 120, 0.3);
      border-radius: 4px;
      background: rgba(30, 30, 40, 0.6);
      color: rgba(180, 180, 200, 0.5);
      cursor: pointer;
      transition: all 0.2s;
    }

    .qp-tier-btn:hover {
      background: rgba(60, 60, 80, 0.6);
      color: rgba(200, 200, 220, 0.8);
    }

    .qp-tier-btn.active {
      border-color: rgba(160, 140, 255, 0.5);
      background: rgba(160, 140, 255, 0.12);
      color: #a08cff;
    }

    /* ultra max gets special treatment bc why not */
    .qp-tier-btn.ultra {
      border-color: rgba(255, 180, 60, 0.3);
    }

    .qp-tier-btn.ultra:hover {
      border-color: rgba(255, 180, 60, 0.5);
      color: rgba(255, 210, 120, 0.8);
    }

    .qp-tier-btn.ultra.active {
      border-color: rgba(255, 180, 60, 0.6);
      background: rgba(255, 180, 60, 0.12);
      color: #ffc040;
      box-shadow: 0 0 12px rgba(255, 180, 60, 0.1);
    }

    .qp-auto-label {
      font-size: 9px;
      color: rgba(140, 140, 160, 0.4);
      text-align: center;
    }

    .qp-current {
      font-size: 10px;
      color: rgba(160, 255, 160, 0.6);
      margin-top: 6px;
      text-align: center;
    }

    #debug-coords {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 50;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(160, 140, 255, 0.2);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #a0ffa0;
      pointer-events: none;
      white-space: pre;
    }

    #record-btn {
      position: fixed;
      top: 16px;
      left: 340px;
      z-index: 50;
      padding: 8px 14px;
      background: rgba(255, 60, 60, 0.15);
      border: 1px solid rgba(255, 60, 60, 0.4);
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #ff6060;
      cursor: pointer;
      transition: all 0.2s;
    }

    #record-btn:hover {
      background: rgba(255, 60, 60, 0.3);
    }

    #record-btn.recording {
      color: #ff3030;
      border-color: #ff3030;
      animation: rec-blink 0.6s ease infinite;
    }

    @keyframes rec-blink {
      50% {
        opacity: 0.4;
      }
    }



    /* coming soon text over the book */
    #coming-soon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, calc(-50% - 50px));
      color: #ffd8a8;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.8rem, 6vw, 4rem);
      font-style: italic;
      font-weight: 400;
      letter-spacing: clamp(2px, 1vw, 6px);
      text-shadow: 0 0 20px rgba(255, 180, 100, 0.4), 0 0 40px rgba(255, 140, 50, 0.2);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
      pointer-events: none;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      width: 90vw;
      text-align: center;
    }

    #coming-soon.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .coming-soon-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.7rem, 2.5vw, 0.95rem);
      font-style: normal;
      font-weight: 300;
      letter-spacing: 2px;
      color: #ffd8a8;
      text-shadow: 0 0 20px rgba(255, 180, 100, 0.4), 0 0 40px rgba(255, 140, 50, 0.2);
      margin-top: 12px;
      text-transform: none;
    }

    .coming-soon-buttons {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: 20px;
    }

    /* secondary row: CV + Github */
    .cs-row-secondary {
      display: flex;
      gap: clamp(24px, 6vw, 56px);
      margin-bottom: 18px;
    }

    .cs-btn {
      padding: 10px clamp(20px, 5vw, 36px);
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(13px, 2.5vw, 15px);
      font-weight: 600;
      font-style: normal;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      border: 1.5px solid rgba(90, 55, 20, 0.5);
      border-radius: 4px;
      background: rgba(60, 35, 10, 0.35);
      color: #f5dbb5;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.15),
        0 2px 8px rgba(30, 15, 0, 0.3);
    }

    .cs-btn:hover {
      background: rgba(80, 45, 10, 0.5);
      border-color: rgba(200, 150, 60, 0.6);
      box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.25),
        0 0 16px rgba(200, 150, 60, 0.25),
        0 4px 12px rgba(30, 15, 0, 0.3);
      color: #ffe8c4;
      transform: translateY(-2px);
    }

    .cs-btn:active {
      transform: translateY(0);
    }

    /* primary action — the book invite */
    .cs-btn-primary {
      padding: 14px clamp(36px, 8vw, 56px);
      font-size: clamp(14px, 2.8vw, 17px);
      font-style: italic;
      letter-spacing: 4px;
      border-color: rgba(180, 130, 50, 0.45);
      background: rgba(70, 45, 15, 0.45);
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 160, 0.12),
        0 0 24px rgba(200, 150, 60, 0.1),
        0 4px 16px rgba(30, 15, 0, 0.35);
    }

    .cs-btn-primary:hover {
      border-color: rgba(232, 196, 124, 0.55);
      background: rgba(90, 60, 20, 0.55);
      box-shadow:
        inset 0 1px 0 rgba(255, 220, 160, 0.2),
        0 0 32px rgba(232, 196, 124, 0.18),
        0 6px 20px rgba(30, 15, 0, 0.4);
    }

    /* tap prompt for mobile */
    #tap-prompt {
      position: fixed;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: rgba(255, 216, 168, 0.5);
      text-shadow: 0 0 12px rgba(255, 180, 100, 0.3);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
      pointer-events: none;
      animation: tap-pulse 2.5s ease-in-out infinite;
      white-space: nowrap;
    }

    #tap-prompt.visible {
      opacity: 1;
      visibility: visible;
    }

    @keyframes tap-pulse {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 0.9;
      }
    }

    /* ── Mobile overrides ── */
    @media (max-width: 768px) {
      #coming-soon {
        transform: translate(-50%, -50%);
      }

      .cs-btn-primary {
        padding: 12px clamp(28px, 6vw, 48px);
      }

      .cv-embed {
        width: 95vw;
        height: 70vh;
      }

      .cv-modal-close {
        top: -10px;
        right: -5px;
        width: 40px;
        height: 40px;
        font-size: 22px;
      }

      .loader-title {
        font-size: 22px;
        letter-spacing: 4px;
      }

      .progress-track {
        width: 180px;
      }
    }

    /* CV modal overlay */
    #cv-modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(6, 6, 11, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #cv-modal.open {
      display: flex;
      opacity: 1;
    }

    .cv-modal-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 90vw;
      max-height: 90vh;
    }

    .cv-modal-close {
      position: absolute;
      top: -14px;
      right: -14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(160, 140, 255, 0.3);
      background: rgba(20, 18, 35, 0.9);
      color: var(--text-primary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
      z-index: 10;
      line-height: 1;
    }

    .cv-modal-close:hover {
      background: rgba(160, 140, 255, 0.2);
      border-color: rgba(160, 140, 255, 0.5);
      transform: scale(1.1);
    }

    .cv-embed {
      width: 680px;
      max-width: 88vw;
      height: 78vh;
      border: 1px solid rgba(160, 140, 255, 0.15);
      border-radius: 8px;
      background: #fff;
    }

    .cv-download-btn {
      padding: 10px 28px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(232, 196, 124, 0.3);
      border-radius: 6px;
      background: rgba(232, 196, 124, 0.08);
      color: var(--accent-warm);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cv-download-btn:hover {
      background: rgba(232, 196, 124, 0.18);
      border-color: rgba(232, 196, 124, 0.5);
      box-shadow: 0 0 18px rgba(232, 196, 124, 0.12);
      transform: translateY(-2px);
    }

    /* ── Guestbook modal ── */
    #guestbook-modal {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(12, 8, 4, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #guestbook-modal.open {
      display: flex;
      opacity: 1;
    }

    .gb-modal-inner {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0;
      width: 440px;
      max-width: 92vw;
      padding: 0;
      background:
        linear-gradient(168deg,
          rgba(58, 42, 28, 0.95) 0%,
          rgba(38, 26, 16, 0.97) 40%,
          rgba(28, 18, 10, 0.98) 100%);
      border: 1px solid rgba(180, 140, 80, 0.18);
      border-radius: 4px;
      box-shadow:
        0 1px 0 rgba(255, 220, 160, 0.06) inset,
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 100px rgba(180, 120, 40, 0.04);
      overflow: hidden;
    }

    /* parchment grain */
    .gb-modal-inner::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    /* top decorative border */
    .gb-header {
      position: relative;
      z-index: 1;
      padding: 32px 36px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(180, 140, 80, 0.1);
    }

    .gb-header::after {
      content: '✦';
      display: block;
      margin-top: 14px;
      font-size: 8px;
      letter-spacing: 18px;
      color: rgba(200, 160, 80, 0.25);
    }

    .gb-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 5px;
      color: #e8c47c;
      text-shadow:
        0 0 20px rgba(232, 196, 124, 0.2),
        0 1px 2px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .gb-body {
      position: relative;
      z-index: 1;
      padding: 24px 36px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .gb-modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border-radius: 2px;
      border: 1px solid rgba(180, 140, 80, 0.15);
      background: rgba(40, 28, 16, 0.6);
      color: rgba(200, 160, 100, 0.5);
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      z-index: 10;
      line-height: 1;
    }

    .gb-modal-close:hover {
      color: rgba(232, 196, 124, 0.9);
      border-color: rgba(180, 140, 80, 0.35);
      background: rgba(60, 40, 20, 0.8);
    }

    .gb-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gb-label {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: lowercase;
      font-variant: small-caps;
      color: rgba(200, 160, 100, 0.45);
    }

    .gb-input,
    .gb-textarea {
      width: 100%;
      padding: 12px 16px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
      font-weight: 400;
      color: #e8dcc8;
      background: rgba(255, 240, 210, 0.03);
      border: none;
      border-bottom: 1px solid rgba(180, 140, 80, 0.15);
      border-radius: 0;
      outline: none;
      transition: border-color 0.4s ease, background 0.4s ease;
      letter-spacing: 0.3px;
    }

    .gb-input:focus,
    .gb-textarea:focus {
      border-bottom-color: rgba(232, 196, 124, 0.4);
      background: rgba(255, 240, 210, 0.05);
    }

    .gb-input::placeholder,
    .gb-textarea::placeholder {
      font-style: italic;
      color: rgba(200, 170, 120, 0.18);
    }

    .gb-textarea {
      resize: none;
      min-height: 120px;
      max-height: 200px;
      line-height: 1.7;
    }

    .gb-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 4px;
    }

    .gb-char-count {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
      color: rgba(200, 160, 100, 0.2);
      letter-spacing: 0.5px;
      transition: color 0.3s;
    }

    .gb-char-count.warn {
      color: rgba(220, 160, 60, 0.5);
    }

    .gb-char-count.over {
      color: rgba(200, 80, 60, 0.6);
    }

    .gb-send-btn {
      padding: 11px 32px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 14px;
      font-weight: 600;

  <script>
    function openCvModal() {
      // iOS doesn't render PDF in iframes, just open it directly on mobile
      const mobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768;
      if (mobile) {
        window.open('Resume.pdf', '_blank');
        return;
      }
      const modal = document.getElementById('cv-modal');
      modal.style.display = 'flex';
      // small delay so the transition actually plays
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          modal.classList.add('open');
        });
      });
    }

    function closeCvModal() {
      const modal = document.getElementById('cv-modal');
      modal.classList.remove('open');
      setTimeout(() => {
        modal.style.display = 'none';
      }, 400);
    }

    // close on backdrop click
    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.getElementById('cv-modal');
      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeCvModal();
      });
    });

    // esc to close
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeCvModal();
        closeGuestbook();
        if (typeof closeAdminLogin === 'function') closeAdminLogin();
        if (typeof closeVisitorLog === 'function') closeVisitorLog();
      }
    });
  </script>

    function closeGuestbook() {
      const modal = document.getElementById('guestbook-modal');
      modal.classList.remove('open');

        modal.style.display = 'none';
      }, 400);
    }

    // close on backdrop click
    document.addEventListener('DOMContentLoaded', () => {

      modal.addEventListener('click', (e) => {
        if (e.target === modal) closeGuestbook();
      });
    });

    // char counter
    document.addEventListener('DOMContentLoaded', () => {
      const textarea = document.getElementById('gb-message');
      const counter = document.getElementById('gb-char-count');
      textarea.addEventListener('input', () => {
        const len = textarea.value.length;
        counter.textContent = len + ' / 500';

    async function sendGuestbook() {
      const nameEl = document.getElementById('gb-name');
      const emailEl = document.getElementById('gb-email');
      const msgEl = document.getElementById('gb-message');
      const statusEl = document.getElementById('gb-status');
      const sendBtn = document.getElementById('gb-send');

      const message = msgEl.value.trim();
      if (!message) {
        statusEl.textContent = 'Please write something first.';
        statusEl.className = 'gb-status error';
        return;
      }

      sendBtn.disabled = true;
      statusEl.textContent = 'Sending...';
      statusEl.className = 'gb-status';

      try {
        const payload = {
          name: nameEl.value.trim() || undefined,
          email: emailEl.value.trim() || undefined,
          message: message,
        };

        const res = await fetch(GB_API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        if (res.ok) {
          statusEl.textContent = 'Sent \u2014 thank you!';
          statusEl.className = 'gb-status success';
          msgEl.value = '';
          nameEl.value = '';
          emailEl.value = '';
          document.getElementById('gb-char-count').textContent = '0 / 500';
          document.getElementById('gb-char-count').className = 'gb-char-count';
          setTimeout(() => { sendBtn.disabled = false; }, 3000);
        } else {
          let errMsg = 'Something went wrong. Try again.';
          try {
            const data = await res.json();
            if (data.error) errMsg = data.error;
          } catch (_) { }
          statusEl.textContent = errMsg;
          statusEl.className = 'gb-status error';
          sendBtn.disabled = false;
        }
      } catch (err) {
        // CORS or network failure
        console.error('[guestbook] network error:', err);
        statusEl.textContent = 'Could not reach the server. Check your connection.';
        statusEl.className = 'gb-status error';
        sendBtn.disabled = false;
      }
    }

    async function submitAdminLogin() {
      const keyInput = document.getElementById('admin-key-input');
      const statusEl = document.getElementById('admin-login-status');
      const submitBtn = document.getElementById('admin-login-submit');
      const key = keyInput.value.trim();

      if (!key) {
        statusEl.textContent = 'key is required';
        return;
      }

      submitBtn.disabled = true;
      statusEl.textContent = 'verifying...';

      try {
        const res = await fetch(GB_API + '?limit=1', {
          method: 'GET',
          headers: { 'Authorization': 'Bearer ' + key },
        });

        if (res.ok) {
          __adminToken = key;
          statusEl.textContent = '';
          closeAdminLogin();
          keyInput.value = '';
          loadVisitorLog();
        } else if (res.status === 401) {
          statusEl.textContent = 'invalid key';
          keyInput.value = '';
          keyInput.focus();
        } else {
          statusEl.textContent = 'server error (' + res.status + ')';
        }
      } catch (err) {
        statusEl.textContent = 'network error';
      }
      submitBtn.disabled = false;
    }

    // ── Visitor log ──
    const VL_API = 'https://ningye-api.onrender.com/api/visitor-log';
    let __logOffset = 0;
    const __logLimit = 30;

    async function loadVisitorLog(offset) {
      if (!__adminToken) { openAdminLogin(); return; }
      if (offset !== undefined) __logOffset = offset;

      const modal = document.getElementById('admin-log-modal');
      const container = document.getElementById('admin-log-visitors');
      const countEl = document.getElementById('admin-log-count');
      const pagEl = document.getElementById('admin-log-pagination');

      modal.style.display = 'flex';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => { modal.classList.add('open'); });
      });

      container.innerHTML = '<div class="admin-log-empty">loading...</div>';
      pagEl.innerHTML = '';

      try {
        const res = await fetch(
          VL_API + '?limit=' + __logLimit + '&offset=' + __logOffset,
          { headers: { 'Authorization': 'Bearer ' + __adminToken } }
        );

        if (res.status === 401) {
          __adminToken = null;
          closeVisitorLog();
          openAdminLogin();
          document.getElementById('admin-login-status').textContent = 'session expired';
          return;
        }

        if (!res.ok) {
          container.innerHTML = '<div class="admin-log-empty">failed to load (' + res.status + ')</div>';
          return;
        }

        const data = await res.json();
        countEl.textContent = data.total + ' unique visitor' + (data.total !== 1 ? 's' : '');

        if (data.visitors.length === 0) {
          container.innerHTML = '<div class="admin-log-empty">no visitors recorded yet</div>';
          return;
        }

        container.innerHTML = data.visitors.map(renderVisitorCard).join('');

        const totalPages = Math.ceil(data.total / __logLimit);
        const currentPage = Math.floor(__logOffset / __logLimit) + 1;

        if (totalPages > 1) {
          pagEl.innerHTML =
            '<button ' + (__logOffset <= 0 ? 'disabled' : '') +
            ' onclick="loadVisitorLog(' + Math.max(0, __logOffset - __logLimit) + ')">\u2190 prev</button>' +
            '<span>' + currentPage + ' / ' + totalPages + '</span>' +
            '<button ' + (__logOffset + __logLimit >= data.total ? 'disabled' : '') +
            ' onclick="loadVisitorLog(' + (__logOffset + __logLimit) + ')">next \u2192</button>';
        }
      } catch (err) {
        console.error('[admin] visitor log error:', err);
        container.innerHTML = '<div class="admin-log-empty">network error</div>';
      }
    }

    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return String(unsafe)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDate(dateString) {
      if (!dateString) return 'Never';
      const d = new Date(dateString);
      return isNaN(d.getTime()) ? 'Unknown' : d.toLocaleString(undefined, {
        month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
      });
    }

    function renderVisitorCard(v) {
      var loc = [v.location.city, v.location.region, v.location.country].filter(Boolean).join(', ');
      var locLine = loc ? '<div class="visitor-location">' + escapeHtml(loc) + '</div>' : '';
      var msgBadge = v.messages.length > 0
        ? '<span class="visitor-badge has-msg">' + v.messages.length + ' msg' + (v.messages.length > 1 ? 's' : '') + '</span>' : '';

      var hw = v.hardware, hwFields = [];
      if (hw.gpuRenderer) hwFields.push(vField('gpu', hw.gpuRenderer));
      if (hw.gpuVendor) hwFields.push(vField('vendor', hw.gpuVendor));
      if (hw.deviceMemory) hwFields.push(vField('ram', hw.deviceMemory + ' GB'));
      if (hw.coreCount) hwFields.push(vField('cores', hw.coreCount));
      if (hw.deviceType) hwFields.push(vField('type', hw.deviceType));
      if (hw.screenWidth && hw.screenHeight) hwFields.push(vField('screen', hw.screenWidth + 'x' + hw.screenHeight + (hw.pixelRatio ? ' @' + hw.pixelRatio + 'x' : '')));
      if (hw.connection) hwFields.push(vField('conn', hw.connection));
      if (hw.webglVersion) hwFields.push(vField('webgl', 'v' + hw.webglVersion));

      var locFields = [];
      if (v.location.city) locFields.push(vField('city', v.location.city));
      if (v.location.region) locFields.push(vField('region', v.location.region));
      if (v.location.country) locFields.push(vField('country', v.location.country));
      if (v.location.timezone) locFields.push(vField('tz', v.location.timezone));
      if (v.location.isp) locFields.push(vField('isp', v.location.isp));

      var msgItems = v.messages.map(function (m) {
        var emailLine = m.email ? '<div class="visitor-msg-email">' + escapeHtml(m.email) + '</div>' : '';
        return '<div class="visitor-msg"><div class="visitor-msg-header"><span class="visitor-msg-name">' +
          escapeHtml(m.name || 'Anonymous') + '</span><span class="visitor-msg-time">' +
          formatDate(m.createdAt) + '</span></div>' + emailLine +
          '<div class="visitor-msg-body">' + escapeHtml(m.message) + '</div></div>';
      }).join('');

      var msgsSection = '';
      if (v.messages.length > 0) {
        var label = v.messages.length + ' message' + (v.messages.length > 1 ? 's' : '') + ' from "Write to me"';
        msgsSection =
          '<div class="visitor-section"><div class="visitor-section-title">messages</div>' +
            '<div class="visitor-msgs-wrap">' +
              '<button type="button" class="visitor-msgs-toggle" onclick="toggleVisitorMessages(event, this)">' +
                '<span class="chev">\u25B6</span>' + escapeHtml(label) +
              '</button>' +
              '<div class="visitor-msgs-list">' + msgItems + '</div>' +
            '</div>' +
          '</div>';
      }

      var uaLine = v.userAgent
        ? '<div class="visitor-section"><div class="visitor-section-title">user agent</div><div class="visitor-ua">' + escapeHtml(v.userAgent) + '</div></div>' : '';

      return '<div class="visitor-card"><div class="visitor-card-header" onclick="toggleVisitorCard(this)"><div>' +
        '<div class="visitor-id-row"><span class="visitor-ip">' + escapeHtml(v.ipHash) + '</span>' +
        '<span class="visitor-badge">' + v.visitCount + ' visit' + (v.visitCount > 1 ? 's' : '') + '</span>' +
        msgBadge + '</div>' + locLine + '</div>' +
        '<div class="visitor-meta-right"><span class="visitor-visits">last: ' + formatDate(v.lastSeen) + '</span>' +
        '<span class="visitor-lastseen">first: ' + formatDate(v.firstSeen) + '</span></div></div>' +
        '<div class="visitor-card-body">' +
        (hwFields.length > 0 ? '<div class="visitor-section"><div class="visitor-section-title">hardware</div><div class="visitor-grid">' + hwFields.join('') + '</div></div>' : '') +
        (locFields.length > 0 ? '<div class="visitor-section"><div class="visitor-section-title">location</div><div class="visitor-grid">' + locFields.join('') + '</div></div>' : '') +
        msgsSection +
        uaLine + '</div></div>';
    }

    function vField(label, value) {
      return '<div class="visitor-field"><span class="visitor-field-label">' + label + '</span><span class="visitor-field-value">' + escapeHtml(String(value)) + '</span></div>';
    }

    function toggleVisitorCard(headerEl) {
      headerEl.closest('.visitor-card').classList.toggle('expanded');
    }

    function toggleVisitorMessages(ev, btnEl) {
      ev.stopPropagation();
      btnEl.closest('.visitor-msgs-wrap').classList.toggle('open');
    }

    function closeVisitorLog() {
      var modal = document.getElementById('admin-log-modal');
      modal.classList.remove('open');
      setTimeout(function () { modal.style.display = 'none'; }, 400);
    }

    // wipe the admin token when the page unloads for security
    window.addEventListener('beforeunload', function () {
      __adminToken = null;
    });

  </script>

  <!-- tree growth video — played in sync with GLTF loading progress.
       replaces the old 240-frame image sequence (~69 MB in memory) with a
       single ~1.3 MB mp4. NOTE: we deliberately PLAY the video forward and
       modulate playbackRate toward a download-derived target instead of
       SEEKING it (currentTime = ...). seeking an inter-frame h.264 clip snaps
       to sparse keyframes and looks blocky; forward decode renders every frame
       so the tree grows smoothly. -->
  <script>
    (function initTreeLoader() {
      const loaderEl = document.getElementById('loader');
      const video = document.getElementById('loader-tree-video');
      const percentEl = document.getElementById('loader-percent');
      const progressFill = document.getElementById('progress-fill');
      if (!video) return;

      let duration = 0;      // video length, read from metadata
      let ready = false;     // metadata loaded + safe to drive
      let targetTime = 0;    // how far the download says the tree should be grown
      let finishing = false; // download done — let the tree play out to the end
      let done = false;      // end reached + handed back to the caller
      let onComplete = null; // fired once the tree has actually finished growing

      try { video.pause(); } catch (e) {}
      video.playbackRate = 1;

      video.addEventListener('loadedmetadata', () => {
        duration = (isFinite(video.duration) && video.duration > 0) ? video.duration : 8;
        ready = true;
        // if the download beat the metadata, aim straight for the end
        if (finishing) targetTime = duration;
      });

      // muted + playsinline lets us autoplay without a user gesture; we just
      // need one play() to "unlock" the decoder, then animate() gates playback.
      video.addEventListener('canplay', () => {
        const p = video.play();
        if (p && typeof p.then === 'function') p.catch(() => {});
      }, { once: true });

      // called by the GLTF progress callback (0–100). only nudges the target
      // forward; the video's own currentTime is what drives the on-screen
      // number, so the tree and the percentage can never disagree.
      window.updateLoaderFrame = function (pct) {
        if (!duration || finishing) return;
        const t = Math.min(Math.max(pct, 0) / 100, 1) * duration;
        if (t > targetTime) targetTime = t;
      };

      // called once the model has fully loaded. lets the tree play out to the
      // end, and only calls `cb` once the video has genuinely finished, so we
      // never flash 100% / fade out while the tree is still mid-growth.
      window.completeLoaderVideo = function (cb) {
        onComplete = cb;
        finishing = true;
        if (ready && duration) targetTime = duration;
        // safety net: never trap the user on the loader if the video can't play
        setTimeout(settle, 4000);
      };

      function settle() {
        if (done) return;
        done = true;
        try { video.pause(); } catch (e) {}
        if (percentEl) percentEl.textContent = '100%';
        if (progressFill) progressFill.style.width = '100%';
        const cb = onComplete;
        onComplete = null;
        if (cb) cb();
      }

      function animate() {
        if (loaderEl.classList.contains('hidden')) return;

        if (ready && duration) {
          const ct = video.currentTime;
          const gap = targetTime - ct;

          if (gap > 0.05) {
            // behind the target → play forward, faster the further behind we
            // are. modulating playbackRate (vs. seeking) keeps it buttery.
            const rate = finishing
              ? Math.min(Math.max(gap * 1.5, 2), 6)   // download done: play out briskly
              : Math.min(Math.max(gap * 2, 0.6), 5);  // tracking download: ease along
            video.playbackRate = rate;
            if (video.paused) video.play().catch(() => {});
          } else if (gap <= 0) {
            // caught up to the download → hold this frame until more arrives
            if (!video.paused) { try { video.pause(); } catch (e) {} }
          }

          // number + bar follow the frame the user actually sees, so "100%"
          // only ever appears when the tree is fully grown.
          const pct = Math.min((ct / duration) * 100, 100);
          if (percentEl) percentEl.textContent = Math.round(pct) + '%';
          if (progressFill) progressFill.style.width = pct + '%';

          // fully grown + download done → hand control back to the caller
          if (finishing && (video.ended || duration - ct <= 0.05)) settle();
        }

        requestAnimationFrame(animate);
      }
      animate();
    })();
  </script>

  {
    "imports": {

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // hardware detection + RAG quality pipeline
    // runs during loading, picks quality settings based on the visitor's GPU
    import { SystemPerfTracker, adaptForThreeJS, applyToRenderer } from './SystemPerfTracker/perf-tracker.js';

    // ── KILL SWITCH ──
    // set to false to disable automatic quality changes.
    // the system still runs detection and shows results in the admin panel,
    // but won't touch the renderer. everything stays at original defaults.
    const ENABLE_ADAPTIVE_QUALITY = false;

    // kick off hardware analysis immediately, it runs in parallel with
    // the model download so it doesn't add any loading time.
    // runs even when disabled bc we still want the info for the admin panel.
    const perfTracker = new SystemPerfTracker({ runBenchmark: true });
    const perfPromise = perfTracker.analyze().catch(err => {
      console.warn('perf tracker failed, using defaults:', err);
      return null;
    });

    // dom nodes
    const loaderEl = document.getElementById('loader');
    const progressFill = document.getElementById('progress-fill');
    const percentEl = document.getElementById('loader-percent');
    const hintsEl = document.getElementById('controls-hint');

    // detect mobile for performance tuning
    // this is a quick check used before the perf tracker finishes
    const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || window.innerWidth < 768;

    // scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06060b);

    // trying to match blender viewport so we dont get distortion
    // TODO: idk if these pivots are exactly right, maybe revisit if it feels off
    // tbh i jsut copied the coordinates from the debug overlay lol
    // 28 v-fov is roughly a 50mm lens
    const camera = new THREE.PerspectiveCamera(
      28,
      window.innerWidth / window.innerHeight,
      0.1,
      500
    );
    scene.add(camera);

    // Dedicated light just for the medallion (Layer 1)
    const medallionLight = new THREE.DirectionalLight(0xfff4e0, 10.5);
    medallionLight.position.set(1, 1, 2); // Offset slightly to make normal maps pop
    medallionLight.layers.set(1);
    camera.add(medallionLight);

    const medallionAmbient = new THREE.AmbientLight(0xffeedd, 3.0); // Provides uniform base lighting
    medallionAmbient.layers.set(1);
    scene.add(medallionAmbient);


    // hardcoded final positions from my debug output
    const TARGET_CAM_POS = new THREE.Vector3(0.857, 3.925, 4.559);
    const TARGET_LOOK_AT = new THREE.Vector3(-0.131, 0.081, 0.738);

    // pull back a bit for the intro dolly effect
    camera.position.copy(TARGET_CAM_POS).multiplyScalar(1.15);

    // setup renderer with conservative defaults.
    // the perf tracker will override these once it finishes analyzing.
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    // shadows off: the glb lights are scaled to 0.0005, shadow contribution is invisible
    renderer.shadowMap.enabled = false;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // quality settings from the perf tracker. populated once analysis finishes.
    let adaptedQuality = null;
    let currentTierOverride = null; // when admin manually picks a tier
    let detectedTier = null; // what the RAG pipeline decided

    // tier presets for the admin panel. tier 4 is "ultra max",
    // cranks everything past what auto-detect would ever pick
    const TIER_PRESETS = {
      0: {
        pixelRatio: 0.5, maxTextureSize: 512, shadowsEnabled: false,
        fireflyCount: 0, antialias: false,
        toneMapping: 1, toneMappingExposure: 1.0, label: 'OFF',
      },
      1: {
        pixelRatio: 0.75, maxTextureSize: 1024, shadowsEnabled: false,
        fireflyCount: 80, antialias: false,
        toneMapping: 4, toneMappingExposure: 1.4, label: 'LOW',
      },
      2: {
        pixelRatio: 1.0, maxTextureSize: 2048, shadowsEnabled: false,
        fireflyCount: 200, antialias: true,
        toneMapping: 4, toneMappingExposure: 1.6, label: 'MID',
      },
      3: {
        pixelRatio: Math.min(window.devicePixelRatio, 1.5), maxTextureSize: 4096,
        shadowsEnabled: true, fireflyCount: 400, antialias: true,
        toneMapping: 4, toneMappingExposure: 1.6, label: 'HIGH',
      },
      4: {
        // the pretty one. cranked pixel ratio, full device dpr,
        // max textures, max particles, shadows on. this is what
        // you'd show off on a beefy machine.
        pixelRatio: window.devicePixelRatio, maxTextureSize: 4096,
        shadowsEnabled: true, fireflyCount: 600, antialias: true,
        toneMapping: 4, toneMappingExposure: 1.8, label: 'ULTRA MAX',
      },
    };

    // apply a tier preset to the live renderer. called from the panel buttons.
    // when ENABLE_ADAPTIVE_QUALITY is off, this only updates the UI highlight.
    window.setQualityTier = function (tier) {
      const preset = TIER_PRESETS[tier];
      if (!preset) return;
      currentTierOverride = tier;

      if (ENABLE_ADAPTIVE_QUALITY) {
        // renderer settings
        renderer.setPixelRatio(preset.pixelRatio);
        renderer.toneMapping = preset.toneMapping;
        renderer.toneMappingExposure = preset.toneMappingExposure;
        renderer.shadowMap.enabled = preset.shadowsEnabled;

        // firefly visuals
        if (SHOW_FIREFLIES) {
          if (preset.fireflyCount === 0) {
            ffMat.visible = false;
          } else {
            ffMat.visible = true;
            ffMat.size = preset.fireflyCount >= 400 ? 0.14 : preset.fireflyCount >= 200 ? 0.12 : 0.08;
            ffMat.opacity = preset.fireflyCount >= 400 ? 0.8 : preset.fireflyCount >= 200 ? 0.7 : 0.4;
          }
        }
      }

      // update the panel UI always (even when disabled, so you can see what you picked)
      document.querySelectorAll('.qp-tier-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.tier) === tier);
      });
      const label = tier === 4 ? 'ULTRA MAX' : preset.label;
      const suffix = ENABLE_ADAPTIVE_QUALITY ? '' : ' (display only)';
      document.getElementById('qp-current').textContent = `active: ${label} (tier ${tier})${suffix}`;
      document.getElementById('qp-auto-label').textContent =
        detectedTier !== null ? `auto-detected: tier ${detectedTier}` : '';

      console.log(`[quality] switched to tier ${tier} (${label})${suffix}`);
    };

    // orbit controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 40;
    controls.maxPolarAngle = Math.PI * 0.88;
    controls.target.copy(TARGET_LOOK_AT);
    controls.enabled = false;           // lock it down until intro is done
    controls.update();

    // lights
    const USE_CUSTOM_LIGHTS = false; // toggle if we want custom lights or jsut blender exports
    const GLB_LIGHT_INTENSITY = 0.0005;  // idk why exported lights are so strong, crushing them by a lot
    const GLB_LIGHT_TINT = 0xFF8C00;      // tint to orange
    const GLB_LIGHT_TINT_STRENGTH = 0.5; // 0 = no tint, 1 = max tint

    if (USE_CUSTOM_LIGHTS) {
      // fill
      const ambient = new THREE.AmbientLight(0xd0c8ff, 0.6);
      scene.add(ambient);

      // key
      const keyLight = new THREE.DirectionalLight(0xfff4e0, 2.2);
      keyLight.position.set(6, 10, 5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.near = 0.5;
      keyLight.shadow.camera.far = 40;
      keyLight.shadow.camera.left = -15;
      keyLight.shadow.camera.right = 15;
      keyLight.shadow.camera.top = 15;
      keyLight.shadow.camera.bottom = -15;
      keyLight.shadow.bias = -0.0005;
      scene.add(keyLight);

      // cool fill
      const fillLight = new THREE.DirectionalLight(0x9ab8e0, 0.8);
      fillLight.position.set(-5, 4, -3);
      scene.add(fillLight);

      // rim
      const rimLight = new THREE.DirectionalLight(0xc8a0ff, 0.4);
      rimLight.position.set(-3, 6, -8);
      scene.add(rimLight);

      // bounce
      const hemi = new THREE.HemisphereLight(0x2a2840, 0x0a0a10, 0.5);
      scene.add(hemi);
    }

    // firefly particles
    const SHOW_FIREFLIES = true;  // toggle fireflies on/off
    // default count, will be overridden by perf tracker if it finishes in time
    let FIREFLY_COUNT = isMobile ? 120 : 400;
    const FIREFLY_SPREAD = 5;       // spawn radius
    const FIREFLY_HEIGHT_MIN = 0.2;
    const FIREFLY_HEIGHT_MAX = 3.5;

    // draw a glowing circle onto a canvas so we dont need an image asset
    const ffCanvas = document.createElement('canvas');
    ffCanvas.width = 32; ffCanvas.height = 32;
    const ffCtx = ffCanvas.getContext('2d');
    const grad = ffCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255, 210, 80, 1.0)');
    grad.addColorStop(0.3, 'rgba(255, 190, 50, 0.6)');
    grad.addColorStop(1, 'rgba(255, 160, 20, 0.0)');
    ffCtx.fillStyle = grad;
    ffCtx.fillRect(0, 0, 32, 32);
    const ffTexture = new THREE.CanvasTexture(ffCanvas);

    // prealloc arrays for performance
    const ffPositions = new Float32Array(FIREFLY_COUNT * 3);
    const ffPhases = new Float32Array(FIREFLY_COUNT);     // phase
    const ffSpeeds = new Float32Array(FIREFLY_COUNT);     // drift
    const ffBaseY = new Float32Array(FIREFLY_COUNT);      // height base
    const ffRadii = new Float32Array(FIREFLY_COUNT);      // radius

    for (let i = 0; i < FIREFLY_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * FIREFLY_SPREAD;
      ffPositions[i * 3] = Math.cos(angle) * r;
      ffPositions[i * 3 + 1] = FIREFLY_HEIGHT_MIN + Math.random() * (FIREFLY_HEIGHT_MAX - FIREFLY_HEIGHT_MIN);
      ffPositions[i * 3 + 2] = Math.sin(angle) * r;
      ffPhases[i] = Math.random() * Math.PI * 2;
      ffSpeeds[i] = 0.3 + Math.random() * 0.7;
      ffBaseY[i] = ffPositions[i * 3 + 1];
      ffRadii[i] = 0.15 + Math.random() * 0.4;
    }

    const ffGeo = new THREE.BufferGeometry();
    ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPositions, 3));

    const ffMat = new THREE.PointsMaterial({
      map: ffTexture,
      size: 0.12,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    });

    const fireflies = new THREE.Points(ffGeo, ffMat);
    if (SHOW_FIREFLIES) scene.add(fireflies);

    // tick fireflies
    function updateFireflies(elapsed) {
      const pos = ffGeo.attributes.position.array;
      for (let i = 0; i < FIREFLY_COUNT; i++) {
        const phase = ffPhases[i];
        const speed = ffSpeeds[i];
        const t = elapsed * speed + phase;
        // sway
        pos[i * 3] += Math.sin(t * 0.8) * 0.002;
        pos[i * 3 + 1] = ffBaseY[i] + Math.sin(t * 0.5) * 0.3;
        pos[i * 3 + 2] += Math.cos(t * 0.6) * 0.002;
      }
      ffGeo.attributes.position.needsUpdate = true;
      // kinda hacky but gives it a global flicker
      ffMat.opacity = 0.5 + Math.sin(elapsed * 1.5) * 0.2;
    }

    // downscale textures so it doesnt crash mobile browsers bc the glb is huge
    // perf tracker may override this, but we need a sane default in case
    // the model loads before the analysis finishes
    let MAX_TEX = isMobile ? 1024 : 2048;
    const TEX_KEYS = [
      'map', 'normalMap', 'roughnessMap', 'metalnessMap',
      'aoMap', 'emissiveMap', 'bumpMap', 'alphaMap', 'lightMap'
    ];

    function shrinkTexture(tex) {
      const img = tex.image;
      if (!img || !img.width || !img.height) return;
      if (img.width <= MAX_TEX && img.height <= MAX_TEX) return;

      const ratio = img.width / img.height;
      let w, h;
      if (img.width >= img.height) { w = MAX_TEX; h = Math.round(MAX_TEX / ratio); }
      else { h = MAX_TEX; w = Math.round(MAX_TEX * ratio); }

      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      tex.image = c;
      tex.needsUpdate = true;
    }

    function shrinkAllTextures(root) {
      const seen = new Set();
      root.traverse(child => {
        if (!child.isMesh || !child.material) return;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        for (const m of mats) {
          for (const k of TEX_KEYS) {
            const t = m[k];
            if (t && !seen.has(t.uuid)) { seen.add(t.uuid); shrinkTexture(t); }
          }
        }
      });
    }

    // load the giant model
    // shared helper — updates the dev panel with perf results.
    // called from both perfUiPromise (fires as soon as analysis finishes)
    // and the gltf callback (fires again once model loads with latest data).
    function updatePerfPanel(perfResult) {
      if (!perfResult) {
        document.getElementById('qp-info').textContent = 'detection failed\nusing defaults';
        return;
      }
      adaptedQuality = adaptForThreeJS({ tier: perfResult.tier, settings: perfResult.settings });
      detectedTier = perfResult.tier;
      if (ENABLE_ADAPTIVE_QUALITY) {
        applyToRenderer(renderer, adaptedQuality);
        MAX_TEX = adaptedQuality.textures.maxSize;
      }

      const gpu = perfResult.hardware.gpu || 'unknown';
      const conf = (perfResult.confidence * 100).toFixed(1);
      const bench = perfResult.benchmark ? `${perfResult.benchmark.fps} fps` : 'skipped';
      const topMatch = perfResult.ragMatches?.[0];
      const source = topMatch?.source?.type || 'hardware-index';
      const exact = topMatch?.scores?.exact !== undefined ? `${(topMatch.scores.exact * 100).toFixed(0)}%` : 'n/a';
      const corpus = perfResult.ragStats?.corpusSize || perfResult.ragContext?.corpus?.corpusSize || 0;
      const profile = perfResult.renderProfile;
      const matchLine = topMatch ? `\nretrieved: ${topMatch.exactModel || topMatch.id}\nmatch: ${(topMatch.similarity * 100).toFixed(0)}% | exact: ${exact}\nsource: ${source}` : '';
      const profileLine = profile ? `\nprofile: ${profile.label} | tex ${profile.maxTextureSize} | dpr ${profile.pixelRatio}\nrender: aa ${profile.antialias ? 'on' : 'off'} | shadows ${profile.shadowsEnabled ? 'on' : 'off'} | fireflies ${profile.fireflyCount}` : '';
      const whyLine = perfResult.reasoning ? `\nwhy: ${perfResult.reasoning}` : '';
      const corpusLine = corpus ? `\ncorpus: ${corpus} GPU profiles` : '';
      const mode = ENABLE_ADAPTIVE_QUALITY ? '\nmode: applied' : '\nmode: display only';
      document.getElementById('qp-info').textContent =
        `gpu: ${gpu}\nconf: ${conf}%\nbench: ${bench}${matchLine}${profileLine}${whyLine}${corpusLine}${mode}`;

      if (ENABLE_ADAPTIVE_QUALITY) {
        window.setQualityTier(perfResult.tier);
      } else {
        document.querySelectorAll('.qp-tier-btn').forEach(btn => {
          btn.classList.toggle('active', parseInt(btn.dataset.tier) === perfResult.tier);
        });
        document.getElementById('qp-current').textContent =
          `detected: tier ${perfResult.tier} (not applied)`;
        document.getElementById('qp-auto-label').textContent =
          'adaptive quality OFF';
      }

      console.log(
        `[SystemPerfTracker] tier ${perfResult.tier} | gpu: ${gpu} | confidence: ${conf}% | ` +
        (ENABLE_ADAPTIVE_QUALITY
          ? `textures: ${MAX_TEX}px | particles: ${adaptedQuality.particles.fireflyCount}`
          : 'adaptive quality disabled, display only')
      );
    }

    // fire the panel as soon as analysis is done — usually before the GLB finishes downloading
    const perfUiPromise = perfPromise.then(perfResult => {
      updatePerfPanel(perfResult);
      return perfResult;
    });

    // ── Visitor beacon — two-phase logging ──
    // Phase 1: fires immediately with whatever is available right now.
    // no waiting on perf tracker, no waiting on the GLB. if the visitor
    // closes the tab 500ms in, we still get their entry.
    //
    // we also do a fast inline WebGL probe so GPU/vendor land in the DB
    // even when the perf tracker pipeline fails (rare, but seen on locked-
    // down browsers and after WebGL context loss).
    {
      const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
      let quickGpu = null, quickVendor = null, quickWebGL = null;
      try {
        const c = document.createElement('canvas');
        const opts = { powerPreference: 'high-performance', failIfMajorPerformanceCaveat: false };
        const gl = c.getContext('webgl2', opts) || c.getContext('webgl', opts);
        if (gl) {
          quickWebGL = c.getContext('webgl2', opts) ? 2 : 1;
          const ext = gl.getExtension('WEBGL_debug_renderer_info');
          if (ext) {
            quickGpu = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || null;
            quickVendor = gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) || null;
          }
          const lose = gl.getExtension('WEBGL_lose_context');
          if (lose) lose.loseContext();
        }
      } catch { /* WebGL blocked, leave nulls and let Phase 2 try again */ }

      const instantPayload = {
        beacon_phase: 'instant',
        screenWidth: screen.width || null,
        screenHeight: screen.height || null,
        pixelRatio: window.devicePixelRatio || null,
        colorDepth: screen.colorDepth || null,
        deviceType: isMobile ? 'mobile' : 'desktop',
        connection: conn?.effectiveType || null,
        gpuRenderer: quickGpu,
        gpuVendor: quickVendor,
        webglVersion: quickWebGL,
        deviceMemory: navigator.deviceMemory || null,
        coreCount: navigator.hardwareConcurrency || null,
      };
      fetch('https://ningye-api.onrender.com/api/visitor-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(instantPayload),
      }).catch(() => { /* network dead or Render down, nothing we can do */ });
    }

    // Phase 2: fires after perf tracker finishes with full hardware data.
    // the server merges this into the same visitor row (grouped by ip_hash).
    perfPromise.then(perfResult => {
      if (!perfResult) return;
      const hw = perfResult.hardware || {};
      const payload = {
        beacon_phase: 'enriched',
        gpuRenderer: hw.gpu || null,
        gpuVendor: hw.vendor || null,
        deviceMemory: hw.memory || null,
        coreCount: hw.cores || null,
        deviceType: hw.deviceType || null,
        screenWidth: hw.screen?.width || screen.width || null,
        screenHeight: hw.screen?.height || screen.height || null,
        pixelRatio: hw.screen?.pixelRatio || window.devicePixelRatio || null,
        colorDepth: hw.screen?.colorDepth || screen.colorDepth || null,
        connection: hw.connection?.effectiveType || null,
        webglVersion: hw.webglVersion || null,
        batteryLevel: hw.battery?.level ?? null,
        batteryCharging: hw.battery?.charging ?? null,
      };
      fetch('https://ningye-api.onrender.com/api/visitor-log', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      }).catch(() => { /* silently ignore failures */ });
    });
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('/draco/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    // ── LOCAL_MODE ──
    const LOCAL_MODE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1');

    // ── ASSET SOURCE FLAG ──
    // false = serve GLB from /assets/ (bundled with the repo, deployed to GitHub Pages)
    // true  = serve GLB from Cloudflare R2 CDN (assets.ningye.ca)
    // currently false because the R2 cache is serving an old file with no animations
    const USE_R2_ASSETS = false;

    const MODEL_URL = (!LOCAL_MODE && USE_R2_ASSETS)
      ? 'https://assets.ningye.ca/Room_optimized.glb'
      : 'assets/Room_optimized.glb';



    let mixer;

    gltfLoader.load(
      MODEL_URL,
      async (gltf) => {
        console.log('[ANIM-DEBUG] gltf callback fired, animations:', gltf.animations.length,
          gltf.animations.map(a => a.name));
        const model = gltf.scene;

        // wait for the perf tracker if it hasn't finished yet.
        // it usually finishes well before the model downloads,
        // but on fast connections it might still be benchmarking.
        console.log('[ANIM-DEBUG] awaiting perfPromise...');
        const perfResult = await perfPromise;
        console.log('[ANIM-DEBUG] perfPromise resolved, result:', !!perfResult);
        // update the dev panel with detection results
        updatePerfPanel(perfResult);

        // crunch textures using the (possibly updated) MAX_TEX limit
        shrinkAllTextures(model);

        // force shadows on everything, kinda expensive but looks better
        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            // Illuminate ONLY Mesh_0.003
            if (child.name === 'Mesh_0.003') {
              child.layers.enable(1);
              if (child.material) {
                // Force it to glow from within so it bypasses metallic darkness
                child.material.emissive = new THREE.Color(0x553311); // Warm gold glow
                child.material.emissiveIntensity = 2.0;
              }
            }
          }
          if (child.isLight) {
            child.intensity *= GLB_LIGHT_INTENSITY;
            child.color.lerp(new THREE.Color(GLB_LIGHT_TINT), GLB_LIGHT_TINT_STRENGTH);
          }
        });

        scene.add(model);

        if (gltf.animations && gltf.animations.length > 0) {
          console.log('[ANIM-DEBUG] creating mixer, clip count:', gltf.animations.length);
          mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip, i) => {
            const action = mixer.clipAction(clip);
            action.play();
            console.log('[ANIM-DEBUG] playing clip', i, clip.name,
              'duration:', clip.duration, 'tracks:', clip.tracks.length);
          });
          console.log('[ANIM-DEBUG] mixer created, actions:', mixer._actions.length);
        } else {
          console.warn('[ANIM-DEBUG] NO ANIMATIONS in gltf.animations!',
            'raw value:', gltf.animations);
        }

        // if adaptive quality is on and the perf tracker says this device
        // can't handle the scene, adjust the firefly appearance
        if (ENABLE_ADAPTIVE_QUALITY && adaptedQuality) {
          const newCount = adaptedQuality.particles.fireflyCount;
          if (newCount !== FIREFLY_COUNT && SHOW_FIREFLIES) {
            ffMat.size = newCount > 200 ? 0.12 : 0.08;
            ffMat.opacity = newCount > 200 ? 0.7 : 0.4;
          }
        }

        // drive the tree to full growth, THEN fade out. completeLoaderVideo
        // only calls back once the video has actually reached the end, so the
        // 100% / fade can't happen while the tree is still growing.
        const finishLoader = () => {
          loaderEl.classList.add('hidden');
          beginIntroAnimation();
        };
        if (window.completeLoaderVideo) {
          // small hold so the fully-grown tree is visible before the fade
          window.completeLoaderVideo(() => setTimeout(finishLoader, 400));
        } else {
          progressFill.style.width = '100%';
          percentEl.textContent = '100%';
          setTimeout(finishLoader, 1200);
        }
      },
      (progress) => {
        if (progress.total > 0) {
          // cap at 99 during download so the number/tree only hit 100% once
          // the model has fully loaded; the loader's animate loop owns the
          // actual percent text + bar (driven by the eased video time).
          const pct = Math.min((progress.loaded / progress.total) * 100, 99);
          if (window.updateLoaderFrame) window.updateLoaderFrame(pct);
        }
      },
      (err) => {
        console.error('GLB load error:', err);
        percentEl.textContent = 'Load failed';
        const treeVid = document.getElementById('loader-tree-video');
        if (treeVid) treeVid.style.opacity = '0.3';
      }
    );

    // ─── Intro camera dolly ───
    let introActive = false;
    let introT = 0;
    const INTRO_DURATION = 2.4; // seconds

    function beginIntroAnimation() {
      introActive = true;
      introT = 0;

      // let them skip the intro if they click right away
      attachSweepListener();

      // show hints/tap prompt after intro
      setTimeout(() => {
        if (!sweepActive && !window.__fireBurnActive) {
          if (isMobile) {
            document.getElementById('tap-prompt').classList.add('visible');
          } else {
            hintsEl.classList.add('visible');
          }
        }
      }, INTRO_DURATION * 1000 + 400);
    }

    // konami code for devmode
    const FORCE_DEV_MODE = false; // set to true when debugging so u dont have to type it out every time
    window.__devMode = FORCE_DEV_MODE;
    if (window.__devMode) {
      document.body.classList.add('dev-mode');
    }

    let konamiBuffer = '';
    const konamiSequence = 'atlearia';

    window.addEventListener('keydown', (e) => {
      // buffer
      konamiBuffer += e.key.toLowerCase();
      if (konamiBuffer.length > konamiSequence.length) {
        konamiBuffer = konamiBuffer.substring(konamiBuffer.length - konamiSequence.length);
      }

      if (konamiBuffer === konamiSequence) {
        window.__devMode = !window.__devMode;
        if (window.__devMode) {
          document.body.classList.add('dev-mode');
          controls.enabled = true;
          hintsEl.classList.add('visible');
          hintsEl.style.display = 'flex';
        } else {
          document.body.classList.remove('dev-mode');
          controls.enabled = false;
          hintsEl.classList.remove('visible');
          hintsEl.style.display = 'none';
          // wipe admin session when leaving dev mode
          if (typeof __adminToken !== 'undefined') __adminToken = null;
          if (typeof closeAdminLogin === 'function') closeAdminLogin();
          if (typeof closeVisitorLog === 'function') closeVisitorLog();
        }
        konamiBuffer = ''; // reset buffer
      }
    });

    // ── WASD fly controls (dev mode only) ──
    const moveKeys = {};
    const MOVE_SPEED = 2.0;      // units per second
    const _moveDir = new THREE.Vector3();
    const _sideDir = new THREE.Vector3();
    const _camDir = new THREE.Vector3();

    window.addEventListener('keydown', (e) => {
      if (!window.__devMode) return;
      moveKeys[e.key.toLowerCase()] = true;
      if (['w', 'a', 's', 'd', 'q', 'e', ' '].includes(e.key.toLowerCase())) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', (e) => {
      moveKeys[e.key.toLowerCase()] = false;
    });

    function applyWASD(delta) {
      if (!window.__devMode) return;

      // direction camera is facing (flatten Y for horizontal)
      camera.getWorldDirection(_camDir);
      _camDir.y = 0;
      _camDir.normalize();

      // strafe direction (perpendicular)
      _sideDir.crossVectors(camera.up, _camDir).normalize();

      const speed = MOVE_SPEED * delta;
      _moveDir.set(0, 0, 0);

      if (moveKeys['w']) _moveDir.add(_camDir.clone().multiplyScalar(speed));
      if (moveKeys['s']) _moveDir.add(_camDir.clone().multiplyScalar(-speed));
      if (moveKeys['a']) _moveDir.add(_sideDir.clone().multiplyScalar(speed));
      if (moveKeys['d']) _moveDir.add(_sideDir.clone().multiplyScalar(-speed));
      if (moveKeys['shift'] || moveKeys['q']) _moveDir.y -= speed;
      if (moveKeys[' '] || moveKeys['e']) _moveDir.y += speed;

      if (_moveDir.lengthSq() > 0) {
        camera.position.add(_moveDir);
        controls.target.add(_moveDir);
      }
    }

    // standard cubic ease
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    // intro cam
    const INTRO_START = TARGET_CAM_POS.clone().multiplyScalar(1.15);

    // sweep vars
    const SWEEP_CAM_POS = new THREE.Vector3(-0.037, 2.121, 1.028);
    const SWEEP_TARGET = new THREE.Vector3(-0.037, 0.121, 1.028);
    const SWEEP_DURATION = 3.0; // seconds

    let sweepActive = false;
    let sweepT = 0;
    let sweepStartPos = new THREE.Vector3();
    let sweepStartTarget = new THREE.Vector3();
    let sweepTriggered = false;

    // better easing curve, stole this from easing.net
    function easeInOutQuart(t) {
      return t < 0.5
        ? 8 * t * t * t * t
        : 1 - Math.pow(-2 * t + 2, 4) / 2;
    }

    function beginSweep() {
      if (sweepTriggered) return;
      sweepTriggered = true;

      // hide tap prompt
      const tapPrompt = document.getElementById('tap-prompt');
      if (tapPrompt) tapPrompt.classList.remove('visible');

      // snapshot current state so we can lerp from it
      sweepStartPos.copy(camera.position);
      sweepStartTarget.copy(controls.target);

      sweepActive = true;
      sweepT = 0;
      controls.enabled = false;

      // trigger fadein early so it feels seamless
      setTimeout(() => {
        document.getElementById('coming-soon').classList.add('visible');
      }, 2500);
    }

    // attach listeners
    function attachSweepListener() {
      const trigger = () => {
        beginSweep();
        window.removeEventListener('click', trigger);
        window.removeEventListener('touchstart', trigger);
        window.removeEventListener('keydown', trigger);
      };
      window.addEventListener('click', trigger, { once: true });
      window.addEventListener('touchstart', trigger, { once: true });
      window.addEventListener('keydown', trigger, { once: true });
    }

    // main loop
    const clock = new THREE.Clock();

    let _animDebugCount = 0;
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (mixer) {
        mixer.update(delta);
        if (_animDebugCount < 3) {
          console.log('[ANIM-DEBUG] mixer.update tick', _animDebugCount,
            'delta:', delta.toFixed(4),
            'actions:', mixer._actions.length,
            'time:', mixer.time.toFixed(3));
          _animDebugCount++;
        }
      }

      // intro
      if (introActive) {
        introT += delta / INTRO_DURATION;
        if (introT >= 1) {
          introT = 1;
          introActive = false;
          controls.enabled = window.__devMode;
        }
        const t = easeOutCubic(Math.min(introT, 1));
        camera.position.lerpVectors(INTRO_START, TARGET_CAM_POS, t);
        camera.lookAt(TARGET_LOOK_AT);
        controls.target.copy(TARGET_LOOK_AT);
      }

      // sweep
      if (sweepActive) {
        sweepT += delta / SWEEP_DURATION;
        const t = easeInOutQuart(Math.min(sweepT, 1));
        camera.position.lerpVectors(sweepStartPos, SWEEP_CAM_POS, t);
        controls.target.lerpVectors(sweepStartTarget, SWEEP_TARGET, t);
        camera.lookAt(controls.target);
        // orbitcontrols forces 0 roll so we gotta smooth it out or it snaps rly bad
        camera.rotation.z *= (1 - t);

        if (sweepT >= 1) {
          sweepT = 1;
          sweepActive = false;
          // lock pos
          camera.position.copy(SWEEP_CAM_POS);
          controls.target.copy(SWEEP_TARGET);
          camera.lookAt(SWEEP_TARGET);
          controls.update();
          controls.enabled = window.__devMode;
        }
      }

      // dont let orbit override animation
      if (!introActive && !sweepActive) {
        applyWASD(delta);
        controls.update();
      }

      // woooo fireflies
      if (SHOW_FIREFLIES) updateFireflies(clock.elapsedTime);

      renderer.render(scene, camera);

      // debug prints
      const cp = camera.position;
      const ct = controls.target;
      const rot = camera.rotation;
      const toDeg = THREE.MathUtils.radToDeg;
      document.getElementById('debug-coords').textContent =
        `cam pos:  (${cp.x.toFixed(3)}, ${cp.y.toFixed(3)}, ${cp.z.toFixed(3)})\n` +
        `target:   (${ct.x.toFixed(3)}, ${ct.y.toFixed(3)}, ${ct.z.toFixed(3)})\n` +
        `rot:      (${toDeg(rot.x).toFixed(1)}°, ${toDeg(rot.y).toFixed(1)}°, ${toDeg(rot.z).toFixed(1)}°)`;

      // recorder hack
      if (window.__recording) {
        const ms = (performance.now() - window.__recStart).toFixed(1);
        window.__recLog.push(
          `${ms}ms | pos(${cp.x.toFixed(4)}, ${cp.y.toFixed(4)}, ${cp.z.toFixed(4)}) ` +
          `tgt(${ct.x.toFixed(4)}, ${ct.y.toFixed(4)}, ${ct.z.toFixed(4)}) ` +
          `rot(${toDeg(rot.x).toFixed(2)}°, ${toDeg(rot.y).toFixed(2)}°, ${toDeg(rot.z).toFixed(2)}°) ` +
          `intro=${introActive} sweep=${sweepActive} sweepT=${sweepT.toFixed(4)}`
        );
      }
    }
    animate();

    // resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // catch context loss so it doesnt just die silently
    renderer.domElement.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      console.warn('WebGL context lost');
    });
    renderer.domElement.addEventListener('webglcontextrestored', () => {
      console.log('WebGL context restored');
    });
  </script>
</body>

</html>
