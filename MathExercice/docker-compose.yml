version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: mathpractice-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: mathuser
      POSTGRES_PASSWORD: mathpass
      POSTGRES_DB: mathpractice
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
