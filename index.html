<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlearia</title>
  <meta name="description" content="Atlearia — an immersive 3D room experience">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #06060b;
      --bg-surface: #0c0c14;
      --accent-primary: #a08cff;
      --accent-warm: #e8c47c;
      --accent-glow: rgba(160, 140, 255, 0.12);
      --text-primary: #e8e4f0;
      --text-muted: rgba(200, 195, 230, 0.4);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Canvas ── */
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* ── Loading Screen ── */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1),
        visibility 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Particle canvas behind loader content */
    #particle-canvas {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .loader-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Animated sigil / ring */
    .loader-sigil {
      width: 80px;
      height: 80px;
      position: relative;
      margin-bottom: 36px;
    }

    .sigil-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid transparent;
    }

    .sigil-ring-outer {
      border-top-color: var(--accent-primary);
      border-right-color: rgba(160, 140, 255, 0.3);
      animation: sigil-spin 3s linear infinite;
    }

    .sigil-ring-inner {
      inset: 12px;
      border-bottom-color: var(--accent-warm);
      border-left-color: rgba(232, 196, 124, 0.3);
      animation: sigil-spin 2s linear infinite reverse;
    }

    .sigil-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-primary);
      box-shadow: 0 0 20px var(--accent-primary),
        0 0 40px rgba(160, 140, 255, 0.3);
      animation: sigil-pulse 2s ease-in-out infinite;
    }

    @keyframes sigil-spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sigil-pulse {

      0%,
      100% {
        opacity: 0.6;
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.4);
      }
    }

    .loader-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--text-primary);
      margin-bottom: 8px;
      opacity: 0;
      animation: fade-up 0.8s ease forwards 0.2s;
    }

    .loader-subtitle {
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 40px;
      opacity: 0;
      animation: fade-up 0.8s ease forwards 0.5s;
    }

    .progress-track {
      width: 240px;
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 1px;
      overflow: hidden;
      position: relative;
      opacity: 0;
      animation: fade-up 0.8s ease forwards 0.7s;
    }

    .progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-warm));
      border-radius: 1px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-glow {
      position: absolute;
      top: -4px;
      right: -2px;
      width: 20px;
      height: 9px;
      background: radial-gradient(ellipse, var(--accent-primary), transparent);
      filter: blur(3px);
      opacity: 0.8;
    }

    .loader-percent {
      margin-top: 16px;
      font-size: 12px;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      color: rgba(160, 140, 255, 0.6);
      opacity: 0;
      animation: fade-up 0.8s ease forwards 0.9s;
    }

    @keyframes fade-up {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Post-load UI ── */
    .ui-fade {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      pointer-events: none;
    }

    .ui-fade.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    #controls-hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 24px;
      transition-delay: 0.6s;
    }

    .hint-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: rgba(200, 195, 230, 0.25);
    }

    .hint-key {
      padding: 3px 8px;
      border: 1px solid rgba(160, 140, 255, 0.1);
      border-radius: 4px;
      font-size: 10px;
      font-weight: 400;
      color: rgba(160, 140, 255, 0.4);
      background: rgba(160, 140, 255, 0.03);
    }

    /* Debug coordinate overlay */
    /* ── Dev Tools (hidden by default) ── */
    #debug-coords, #record-btn, #controls-hint {
      display: none;
    }
    body.dev-mode #debug-coords,
    body.dev-mode #record-btn {
      display: block;
    }

    #debug-coords {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 50;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(160, 140, 255, 0.2);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #a0ffa0;
      pointer-events: none;
      white-space: pre;
    }

    #record-btn {
      position: fixed;
      top: 16px;
      left: 340px;
      z-index: 50;
      padding: 8px 14px;
      background: rgba(255, 60, 60, 0.15);
      border: 1px solid rgba(255, 60, 60, 0.4);
      border-radius: 6px;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      color: #ff6060;
      cursor: pointer;
      transition: all 0.2s;
    }

    #record-btn:hover {
      background: rgba(255, 60, 60, 0.3);
    }

    #record-btn.recording {
      color: #ff3030;
      border-color: #ff3030;
      animation: rec-blink 0.6s ease infinite;
    }

    @keyframes rec-blink {
      50% {
        opacity: 0.4;
      }
    }

    /* ── Book Overlay ── */
    #coming-soon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffd8a8;
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 6px;
      text-shadow: 0 0 20px rgba(255, 180, 100, 0.4), 0 0 40px rgba(255, 140, 50, 0.2);
      opacity: 0;
      visibility: hidden;
      transition: opacity 2.5s ease-in, visibility 2.5s ease-in;
      pointer-events: none;
      z-index: 100;
    }
    #coming-soon.visible {
      opacity: 1;
      visibility: visible;
    }
  </style>
</head>

<body>
  <!-- Loading screen -->
  <div id="loader">
    <canvas id="particle-canvas"></canvas>
    <div class="loader-content">
      <div class="loader-sigil">
        <div class="sigil-ring sigil-ring-outer"></div>
        <div class="sigil-ring sigil-ring-inner"></div>
        <div class="sigil-dot"></div>
      </div>
      <div class="loader-title">Atlearia</div>
      <div class="loader-subtitle">Preparing your space</div>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill">
          <div class="progress-glow"></div>
        </div>
      </div>
      <div class="loader-percent" id="loader-percent">0 %</div>
    </div>
  </div>

  <!-- Debug coordinate readout -->
  <div id="debug-coords">cam: loading...</div>
  <button id="record-btn" onclick="startRecording()">● REC 7s</button>

  <!-- Post-load controls hint -->
  <div id="controls-hint" class="ui-fade">
    <div class="hint-item"><span class="hint-key">LMB</span> Orbit</div>
    <div class="hint-item"><span class="hint-key">RMB</span> Pan</div>
    <div class="hint-item"><span class="hint-key">Scroll</span> Zoom</div>
  </div>

  <!-- Book writing overlay -->
  <div id="coming-soon">Coming soon...</div>

  <!-- Three.js canvas mount -->
  <div id="canvas-container"></div>

  <!-- Recording helper -->
  <script>
    function startRecording() {
      const btn = document.getElementById('record-btn');
      if (window.__recording) return;

      window.__recording = true;
      window.__recStart = performance.now();
      window.__recLog = [];
      btn.classList.add('recording');
      btn.textContent = '● REC...';

      setTimeout(() => {
        window.__recording = false;
        btn.classList.remove('recording');
        btn.textContent = '● REC 7s';
        showRecLog(window.__recLog.join('\n'));
      }, 7000);
    }

    function showRecLog(text) {
      // remove old overlay if any
      const old = document.getElementById('rec-overlay');
      if (old) old.remove();

      const div = document.createElement('div');
      div.id = 'rec-overlay';
      div.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;';

      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'width:80%;height:60%;background:#111;color:#a0ffa0;border:1px solid #333;border-radius:8px;padding:12px;font:11px/1.4 "Courier New",monospace;resize:none;';
      ta.readOnly = true;

      const btnRow = document.createElement('div');
      btnRow.style.cssText = 'display:flex;gap:12px;';

      const copyBtn = document.createElement('button');
      copyBtn.textContent = '📋 Copy All';
      copyBtn.style.cssText = 'padding:8px 20px;background:#2a2a40;color:#a0ffa0;border:1px solid #444;border-radius:6px;cursor:pointer;font-size:13px;';
      copyBtn.onclick = () => { navigator.clipboard.writeText(text); copyBtn.textContent = '✓ Copied!'; };

      const closeBtn = document.createElement('button');
      closeBtn.textContent = '✕ Close';
      closeBtn.style.cssText = 'padding:8px 20px;background:#2a2a40;color:#ff6060;border:1px solid #444;border-radius:6px;cursor:pointer;font-size:13px;';
      closeBtn.onclick = () => div.remove();

      btnRow.appendChild(copyBtn);
      btnRow.appendChild(closeBtn);
      div.appendChild(ta);
      div.appendChild(btnRow);
      document.body.appendChild(div);
    }
  </script>

  <!-- ── Loading screen particle animation ── -->
  <script>
    (function initParticles() {
      const canvas = document.getElementById('particle-canvas');
      const ctx = canvas.getContext('2d');
      let W, H;
      const particles = [];
      const PARTICLE_COUNT = 60;

      function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: (Math.random() - 0.5) * 0.3,
          vy: (Math.random() - 0.5) * 0.3,
          r: Math.random() * 1.5 + 0.5,
          alpha: Math.random() * 0.25 + 0.05,
          pulse: Math.random() * Math.PI * 2,
        });
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.pulse += 0.01;

          if (p.x < 0) p.x = W;
          if (p.x > W) p.x = 0;
          if (p.y < 0) p.y = H;
          if (p.y > H) p.y = 0;

          const a = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(160, 140, 255, ${a})`;
          ctx.fill();
        }

        // draw faint connection lines between close particles
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 140) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `rgba(160, 140, 255, ${0.06 * (1 - dist / 140)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }

        if (!document.getElementById('loader').classList.contains('hidden')) {
          requestAnimationFrame(draw);
        }
      }
      draw();
    })();
  </script>

  <!-- ── Three.js Scene ── -->
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js",
      "three/addons/": "./node_modules/three/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // ─── DOM refs ───
    const loaderEl = document.getElementById('loader');
    const progressFill = document.getElementById('progress-fill');
    const percentEl = document.getElementById('loader-percent');
    const hintsEl = document.getElementById('controls-hint');

    // ─── Scene ───
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06060b);

    // ─── Camera (matched to Blender viewport) ───
    // Blender pivot (-0.7651, 0.3688, 1.7046) → Three.js target: (-0.7651, 1.7046, -0.3688)
    // Blender cam pos via quaternion+distance → Three.js: (13.96, 9.72, 6.14)
    // Blender viewport uses 50mm lens on 36mm sensor → ~28° vertical FOV
    const camera = new THREE.PerspectiveCamera(
      28,
      window.innerWidth / window.innerHeight,
      0.1,
      500
    );

    // final positions — picked from live debug overlay
    const TARGET_CAM_POS = new THREE.Vector3(0.857, 3.925, 4.559);
    const TARGET_LOOK_AT = new THREE.Vector3(-0.131, 0.081, 0.738);

    // start camera slightly further out for a cinematic dolly-in
    camera.position.copy(TARGET_CAM_POS).multiplyScalar(1.15);

    // ─── Renderer ───
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.6;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // ─── Controls ───
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 2;
    controls.maxDistance = 40;
    controls.maxPolarAngle = Math.PI * 0.88;
    controls.target.copy(TARGET_LOOK_AT);
    controls.enabled = false;           // disabled during intro animation
    controls.update();

    // ─── Lighting ───
    const USE_CUSTOM_LIGHTS = false; // true = added studio lights, false = Blender export only
    const GLB_LIGHT_INTENSITY = 0.0005;  // multiplier for Blender-exported lights
    const GLB_LIGHT_TINT = 0xFF8C00;      // warm yellow tint color
    const GLB_LIGHT_TINT_STRENGTH = 0.5; // 0 = no tint, 1 = fully replace with tint color

    if (USE_CUSTOM_LIGHTS) {
      // ambient fill
      const ambient = new THREE.AmbientLight(0xd0c8ff, 0.6);
      scene.add(ambient);

      // key light (warm daylight)
      const keyLight = new THREE.DirectionalLight(0xfff4e0, 2.2);
      keyLight.position.set(6, 10, 5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.near = 0.5;
      keyLight.shadow.camera.far = 40;
      keyLight.shadow.camera.left = -15;
      keyLight.shadow.camera.right = 15;
      keyLight.shadow.camera.top = 15;
      keyLight.shadow.camera.bottom = -15;
      keyLight.shadow.bias = -0.0005;
      scene.add(keyLight);

      // fill (cool blue)
      const fillLight = new THREE.DirectionalLight(0x9ab8e0, 0.8);
      fillLight.position.set(-5, 4, -3);
      scene.add(fillLight);

      // rim / back accent
      const rimLight = new THREE.DirectionalLight(0xc8a0ff, 0.4);
      rimLight.position.set(-3, 6, -8);
      scene.add(rimLight);

      // hemisphere for ground bounce
      const hemi = new THREE.HemisphereLight(0x2a2840, 0x0a0a10, 0.5);
      scene.add(hemi);
    }

    // ─── Fireflies ───
    const FIREFLY_COUNT = 400;
    const FIREFLY_SPREAD = 5;       // radius of spawn area
    const FIREFLY_HEIGHT_MIN = 0.2;
    const FIREFLY_HEIGHT_MAX = 3.5;

    // soft radial glow sprite
    const ffCanvas = document.createElement('canvas');
    ffCanvas.width = 32; ffCanvas.height = 32;
    const ffCtx = ffCanvas.getContext('2d');
    const grad = ffCtx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255, 210, 80, 1.0)');
    grad.addColorStop(0.3, 'rgba(255, 190, 50, 0.6)');
    grad.addColorStop(1, 'rgba(255, 160, 20, 0.0)');
    ffCtx.fillStyle = grad;
    ffCtx.fillRect(0, 0, 32, 32);
    const ffTexture = new THREE.CanvasTexture(ffCanvas);

    // geometry — randomized positions + per-particle data
    const ffPositions = new Float32Array(FIREFLY_COUNT * 3);
    const ffPhases = new Float32Array(FIREFLY_COUNT);     // random phase offset
    const ffSpeeds = new Float32Array(FIREFLY_COUNT);     // drift speed
    const ffBaseY = new Float32Array(FIREFLY_COUNT);      // base height
    const ffRadii = new Float32Array(FIREFLY_COUNT);      // orbit radius

    for (let i = 0; i < FIREFLY_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const r = Math.random() * FIREFLY_SPREAD;
      ffPositions[i * 3] = Math.cos(angle) * r;
      ffPositions[i * 3 + 1] = FIREFLY_HEIGHT_MIN + Math.random() * (FIREFLY_HEIGHT_MAX - FIREFLY_HEIGHT_MIN);
      ffPositions[i * 3 + 2] = Math.sin(angle) * r;
      ffPhases[i] = Math.random() * Math.PI * 2;
      ffSpeeds[i] = 0.3 + Math.random() * 0.7;
      ffBaseY[i] = ffPositions[i * 3 + 1];
      ffRadii[i] = 0.15 + Math.random() * 0.4;
    }

    const ffGeo = new THREE.BufferGeometry();
    ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPositions, 3));

    const ffMat = new THREE.PointsMaterial({
      map: ffTexture,
      size: 0.12,
      transparent: true,
      opacity: 0.7,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      sizeAttenuation: true,
    });

    const fireflies = new THREE.Points(ffGeo, ffMat);
    scene.add(fireflies);

    // animate fireflies each frame
    function updateFireflies(elapsed) {
      const pos = ffGeo.attributes.position.array;
      for (let i = 0; i < FIREFLY_COUNT; i++) {
        const phase = ffPhases[i];
        const speed = ffSpeeds[i];
        const t = elapsed * speed + phase;
        // gentle drift
        pos[i * 3] += Math.sin(t * 0.8) * 0.002;
        pos[i * 3 + 1] = ffBaseY[i] + Math.sin(t * 0.5) * 0.3;
        pos[i * 3 + 2] += Math.cos(t * 0.6) * 0.002;
      }
      ffGeo.attributes.position.needsUpdate = true;
      // subtle global flicker
      ffMat.opacity = 0.5 + Math.sin(elapsed * 1.5) * 0.2;
    }

    // ─── Texture downscaler (keep VRAM tame for 134 MB model) ───
    const MAX_TEX = 2048;
    const TEX_KEYS = [
      'map', 'normalMap', 'roughnessMap', 'metalnessMap',
      'aoMap', 'emissiveMap', 'bumpMap', 'alphaMap', 'lightMap'
    ];

    function shrinkTexture(tex) {
      const img = tex.image;
      if (!img || !img.width || !img.height) return;
      if (img.width <= MAX_TEX && img.height <= MAX_TEX) return;

      const ratio = img.width / img.height;
      let w, h;
      if (img.width >= img.height) { w = MAX_TEX; h = Math.round(MAX_TEX / ratio); }
      else { h = MAX_TEX; w = Math.round(MAX_TEX * ratio); }

      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      tex.image = c;
      tex.needsUpdate = true;
    }

    function shrinkAllTextures(root) {
      const seen = new Set();
      root.traverse(child => {
        if (!child.isMesh || !child.material) return;
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        for (const m of mats) {
          for (const k of TEX_KEYS) {
            const t = m[k];
            if (t && !seen.has(t.uuid)) { seen.add(t.uuid); shrinkTexture(t); }
          }
        }
      });
    }

    // ─── Load Room.glb ───
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');

    const gltfLoader = new GLTFLoader();
    gltfLoader.setDRACOLoader(dracoLoader);

    gltfLoader.load(
      './Room.glb',
      (gltf) => {
        const model = gltf.scene;

        // downscale oversized textures
        shrinkAllTextures(model);

        // enable shadows on every mesh + scale exported lights
        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
          if (child.isLight) {
            child.intensity *= GLB_LIGHT_INTENSITY;
            child.color.lerp(new THREE.Color(GLB_LIGHT_TINT), GLB_LIGHT_TINT_STRENGTH);
          }
        });

        scene.add(model);



        // reveal
        progressFill.style.width = '100%';
        percentEl.textContent = '100 %';

        setTimeout(() => {
          loaderEl.classList.add('hidden');
          beginIntroAnimation();
        }, 600);
      },
      (progress) => {
        if (progress.total > 0) {
          const pct = Math.min((progress.loaded / progress.total) * 100, 99);
          progressFill.style.width = pct + '%';
          percentEl.textContent = Math.round(pct) + ' %';
        }
      },
      (err) => {
        console.error('GLB load error:', err);
        percentEl.textContent = 'Load failed';
        document.querySelector('.loader-sigil').style.display = 'none';
      }
    );

    // ─── Intro camera dolly ───
    let introActive = false;
    let introT = 0;
    const INTRO_DURATION = 2.4; // seconds

    function beginIntroAnimation() {
      introActive = true;
      introT = 0;

      // after intro dolly, show hints and arm the click-sweep
      setTimeout(() => {
        hintsEl.classList.add('visible');
        attachSweepListener();
      }, INTRO_DURATION * 1000 + 400);
    }

    // ─── Dev Mode Konami Code ───
    window.__devMode = false;
    let konamiBuffer = '';
    const konamiSequence = 'atlearia';

    window.addEventListener('keydown', (e) => {
      // keep only the last letters typed
      konamiBuffer += e.key.toLowerCase();
      if (konamiBuffer.length > konamiSequence.length) {
        konamiBuffer = konamiBuffer.substring(konamiBuffer.length - konamiSequence.length);
      }

      if (konamiBuffer === konamiSequence) {
        window.__devMode = !window.__devMode;
        if (window.__devMode) {
          document.body.classList.add('dev-mode');
          controls.enabled = true;
          hintsEl.classList.add('visible');
          hintsEl.style.display = 'flex';
          console.log('[Dev Mode] Enabled orbit controls & debug UI.');
        } else {
          document.body.classList.remove('dev-mode');
          controls.enabled = false;
          hintsEl.classList.remove('visible');
          hintsEl.style.display = 'none';
          console.log('[Dev Mode] Disabled.');
        }
        konamiBuffer = ''; // reset after triggering
      }
    });

    // smooth ease
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    // starting camera position (slightly pulled back)
    const INTRO_START = TARGET_CAM_POS.clone().multiplyScalar(1.15);

    // ─── Click-triggered cinematic sweep ───
    const SWEEP_CAM_POS = new THREE.Vector3(-0.037, 2.121, 1.028);
    const SWEEP_TARGET = new THREE.Vector3(-0.037, 0.121, 1.028);
    const SWEEP_DURATION = 3.0; // seconds

    let sweepActive = false;
    let sweepT = 0;
    let sweepStartPos = new THREE.Vector3();
    let sweepStartTarget = new THREE.Vector3();
    let sweepTriggered = false;

    // smooth S-curve for professional feel
    function easeInOutQuart(t) {
      return t < 0.5
        ? 8 * t * t * t * t
        : 1 - Math.pow(-2 * t + 2, 4) / 2;
    }

    function beginSweep() {
      if (sweepTriggered) return;
      sweepTriggered = true;

      // capture where we currently are
      sweepStartPos.copy(camera.position);
      sweepStartTarget.copy(controls.target);

      sweepActive = true;
      sweepT = 0;
      controls.enabled = false;
    }

    // listen for first click/touch/key after model loaded
    function attachSweepListener() {
      const trigger = () => {
        beginSweep();
        window.removeEventListener('click', trigger);
        window.removeEventListener('touchstart', trigger);
        window.removeEventListener('keydown', trigger);
      };
      window.addEventListener('click', trigger, { once: true });
      window.addEventListener('touchstart', trigger, { once: true });
      window.addEventListener('keydown', trigger, { once: true });
    }

    // ─── Render loop ───
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // phase 1: intro dolly (load → spawn)
      if (introActive) {
        introT += delta / INTRO_DURATION;
        if (introT >= 1) {
          introT = 1;
          introActive = false;
          controls.enabled = window.__devMode;
        }
        const t = easeOutCubic(Math.min(introT, 1));
        camera.position.lerpVectors(INTRO_START, TARGET_CAM_POS, t);
        camera.lookAt(TARGET_LOOK_AT);
        controls.target.copy(TARGET_LOOK_AT);
      }

      // phase 2: click-triggered cinematic sweep
      if (sweepActive) {
        sweepT += delta / SWEEP_DURATION;
        const t = easeInOutQuart(Math.min(sweepT, 1));
        camera.position.lerpVectors(sweepStartPos, SWEEP_CAM_POS, t);
        controls.target.lerpVectors(sweepStartTarget, SWEEP_TARGET, t);
        camera.lookAt(controls.target);
        // zero-out roll gradually so handoff to OrbitControls (which has 0 roll) is seamless
        camera.rotation.z *= (1 - t);

        if (sweepT >= 1) {
          sweepT = 1;
          sweepActive = false;
          // lock final position before re-enabling controls
          camera.position.copy(SWEEP_CAM_POS);
          controls.target.copy(SWEEP_TARGET);
          camera.lookAt(SWEEP_TARGET);
          controls.update();
          controls.enabled = window.__devMode;

          // trigger the text overlay fade-in 0.5s after landing
          setTimeout(() => {
            document.getElementById('coming-soon').classList.add('visible');
          }, 500);
        }
      }

      // only let OrbitControls touch the camera when no animation is running
      if (!introActive && !sweepActive) {
        controls.update();
      }

      // animate fireflies
      updateFireflies(clock.elapsedTime);

      renderer.render(scene, camera);

      // live debug coords
      const cp = camera.position;
      const ct = controls.target;
      const rot = camera.rotation;
      const toDeg = THREE.MathUtils.radToDeg;
      document.getElementById('debug-coords').textContent =
        `cam pos:  (${cp.x.toFixed(3)}, ${cp.y.toFixed(3)}, ${cp.z.toFixed(3)})\n` +
        `target:   (${ct.x.toFixed(3)}, ${ct.y.toFixed(3)}, ${ct.z.toFixed(3)})\n` +
        `rot:      (${toDeg(rot.x).toFixed(1)}°, ${toDeg(rot.y).toFixed(1)}°, ${toDeg(rot.z).toFixed(1)}°)`;

      // recording
      if (window.__recording) {
        const ms = (performance.now() - window.__recStart).toFixed(1);
        window.__recLog.push(
          `${ms}ms | pos(${cp.x.toFixed(4)}, ${cp.y.toFixed(4)}, ${cp.z.toFixed(4)}) ` +
          `tgt(${ct.x.toFixed(4)}, ${ct.y.toFixed(4)}, ${ct.z.toFixed(4)}) ` +
          `rot(${toDeg(rot.x).toFixed(2)}°, ${toDeg(rot.y).toFixed(2)}°, ${toDeg(rot.z).toFixed(2)}°) ` +
          `intro=${introActive} sweep=${sweepActive} sweepT=${sweepT.toFixed(4)}`
        );
      }
    }
    animate();

    // ─── Resize ───
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─── Context loss safety ───
    renderer.domElement.addEventListener('webglcontextlost', (e) => {
      e.preventDefault();
      console.warn('WebGL context lost');
    });
    renderer.domElement.addEventListener('webglcontextrestored', () => {
      console.log('WebGL context restored');
    });
  </script>
</body>

</html>
